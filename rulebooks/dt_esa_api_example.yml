      dynatrace.event_driven_ansible.dt_esa_api:
        dt_api_host: "https://xbr60421.live.dynatrace.com"
        dt_api_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          61653965353939373763376364646639376261613532646661663037373233653230646635303462
          6437653563623239396638353735663366356637316639620a376434323134353264633935643362
          31646636366365663735393338613261343465613930393330316665663436346434326464313361
          3630613835613263370a666637613936333735633064333865346630643833363331316637373061
          62626133633561623966643932336364343863383134626136373965333737306162623239613634
          37633630656565666437376133613139376130303433393236623938323534646265653439353361
          30653166373231643135396365343832613962336231623535646266366233326535613765343033
          36366662666633633830623831626463326161326631633534613431666430373462663531306639
          65393637326139613334316432313235356663613062393939313063333865386364
        delay: 60
  rules:
    - name: Problem - OOM kills
      condition: event.title is match("Out-of-memory kills")
      action:
        run_job_template:
          name: "Dynatrace Debug"
          organization: "Default"
    - name: Problem - No pod ready
      condition: event.title is match("No pod ready")
      action:
        run_job_template:
          name: "Dynatrace Debug"
          organization: "Default"
    - name: Problem - Backoff events
      condition: event.title is match("Backoff event")
      action:
        run_job_template:
          name: "Dynatrace Debug"
          organization: "Default"
    - name: Problem - Response time degradation
      condition: event.title is match("Response time degradation")
      action:
        run_job_template:
          name: "Dynatrace Debug"
          organization: "Default"
